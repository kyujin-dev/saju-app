name: build
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - run: npx cap sync android
      - name: app icon
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp -f android-icons/mipmap-$d/*.png android/app/src/main/res/mipmap-$d/ 2>/dev/null || true
          done
          cp -f android-icons/values/*.xml android/app/src/main/res/values/ 2>/dev/null || true
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: saju-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
